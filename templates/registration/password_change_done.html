{% extends 'base.html' %}

{% block title %}Password Changed - EPMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 space-y-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-green-500/10 text-green-600 border border-green-500/20">
            <i class="fa-solid fa-circle-check text-xl"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-800">Password Changed Successfully</h1>
        <p class="text-slate-500 text-sm leading-relaxed">
            Your password has been changed successfully. You can continue using the application with your new password.
        </p>
        <div class="pt-4 border-t border-slate-100">
            <a href="{% url 'dashboard' %}" class="inline-block px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm shadow-md transition-all cursor-pointer">
                Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
