<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - EPMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-bg {
            background: radial-gradient(circle at 10% 20%, rgb(18, 28, 48) 0%, rgb(9, 15, 26) 90%);
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-md rounded-2xl border border-slate-800 p-8 shadow-2xl space-y-6 text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-green-500/10 text-green-400 mb-2 border border-green-500/20">
            <i class="fa-solid fa-circle-check text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Password Reset Complete</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            Your password has been set. You may go ahead and log in now.
        </p>
        <div class="pt-4 border-t border-slate-800/80">
            <a href="{% url 'login' %}" class="inline-block px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition-all cursor-pointer">
                Log In Now
            </a>
        </div>
    </div>
</body>
</html>
