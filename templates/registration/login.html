<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Performance Management System</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .login-bg {
            background: radial-gradient(circle at 10% 20%, rgb(18, 28, 48) 0%, rgb(9, 15, 26) 90%);
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-md rounded-2xl border border-slate-800 p-8 shadow-2xl space-y-6">
        <!-- Logo and Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 shadow-lg shadow-blue-500/20 text-white mb-2">
                <i class="fa-solid fa-chart-line text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Welcome to EPMS</h1>
            <p class="text-slate-400 text-sm">Sign in to manage employees and track reviews</p>
        </div>
        
        <!-- Errors -->
        {% if form.errors %}
            <div class="bg-red-500/15 border border-red-500/30 text-red-200 text-sm p-4 rounded-lg flex gap-3 items-start">
                <i class="fa-solid fa-circle-exclamation mt-0.5 text-base"></i>
                <div>
                    <span class="font-semibold">Login Failed!</span> Please check your username and password.
                </div>
            </div>
        {% endif %}
        
        <!-- Form -->
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" id="id_username" required autofocus placeholder="Enter your username"
                        class="w-full pl-10 pr-4 py-3 bg-slate-950/40 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                </div>
            </div>
            
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="id_password" class="block text-slate-300 text-xs font-semibold uppercase tracking-wider">Password</label>
                    <a href="{% url 'password_reset' %}" class="text-xs font-medium text-blue-500 hover:text-blue-400 transition-colors">Forgot password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" id="id_password" required placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-3 bg-slate-950/40 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                </div>
            </div>
            
            <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold shadow-lg shadow-blue-600/20 hover:shadow-blue-600/30 transition-all cursor-pointer">
                Sign In
            </button>
        </form>
        
        <div class="border-t border-slate-800/80 pt-4 text-center">
            <p class="text-xs text-slate-500">Authorized personnel only. Sessions are audited.</p>
        </div>
    </div>
    
</body>
</html>
